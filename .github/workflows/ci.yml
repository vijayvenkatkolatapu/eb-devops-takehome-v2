name: ci

on:
  push:
  pull_request:

jobs:
  lint-build-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Lint Helm chart
        run: helm lint chart

      - name: Render chart with harness-style overrides
        run: |
          helm template demo chart \
            --set replicaCount=3 \
            --set config.appName=harness-app \
            --set config.version=9.9.9 \
            --set image.repository=my-service \
            --set image.tag=ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker build -t my-service:${{ github.sha }} ./service

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: my-service:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
